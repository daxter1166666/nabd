name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get
      working-directory: flutter_app

    - name: Build APK with retry
      uses: nick-invision/retry@v3
      with:
        timeout_minutes: 20
        max_attempts: 3
        retry_wait_seconds: 30
       command: cd flutter_app && flutter build apk --release --android-skip-build-dependency-validation
      env:
        GRADLE_OPTS: '-Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Dorg.gradle.daemon=false'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
